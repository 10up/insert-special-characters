name: Test

on:
  workflow_dispatch:
  push:
    branches: [ develop, trunk ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# Cancel superseded runs on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The release zip, built once and shared by every E2E job.
  build:
    uses: ./.github/workflows/build-release-zip.yml

  # Runs against the release zip rather than the source tree, so packaging
  # bugs (a runtime file caught by .distignore) fail here, not after release.
  e2e:
    name: E2E / WP ${{ matrix.wp }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        wp: [ '6.9', latest, trunk ]
    env:
      WP_ENV_CORE: ${{ matrix.wp == 'trunk' && 'WordPress/WordPress' || format( 'https://wordpress.org/wordpress-{0}.zip', matrix.wp ) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}
          path: release/insert-special-characters

      # Mount the unzipped release in place of the checkout. Both entries must
      # name the same source, or wp-env mounts two sources on one path.
      - name: Point the test environment at the release zip
        run: |
          echo '{"plugins":["./release/insert-special-characters"],"mappings":{"/wp-content/plugins/insert-special-characters":"./release/insert-special-characters"}}' > .wp-env.test.override.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Start the test environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run wp-env:test start

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Only the chromium project runs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-wp-${{ matrix.wp }}
          path: artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore
